<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Instrument Serif";src:url(../fonts/instrument-serif-latin-400-normal.woff2)}
@font-face{font-family:"Instrument Serif";src:url(../fonts/instrument-serif-latin-400-italic.woff2);font-style:italic}
@font-face{font-family:"Inter Tight";src:url(../fonts/inter-tight-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:"Inter Tight";src:url(../fonts/inter-tight-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:"Inter Tight";src:url(../fonts/inter-tight-latin-600-normal.woff2);font-weight:600}
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#0e0c0a;color:#f3ece2;font-family:"Inter Tight";-webkit-font-smoothing:antialiased;position:relative}
body::before{content:"";position:absolute;inset:0;background:radial-gradient(760px 520px at 86% 78%,rgba(214,164,109,.20),transparent 62%),radial-gradient(600px 420px at 0% 0%,rgba(214,164,109,.06),transparent 60%)}
.copy{position:absolute;left:72px;top:64px;width:560px}
.brand{font:400 44px/1 "Instrument Serif";letter-spacing:-.01em}
.brand em{color:#d6a46d}
h1{margin:96px 0 0;font:400 86px/.94 "Instrument Serif";letter-spacing:-.02em}
h1 em{color:#f0c993}
p{margin:26px 0 0;font-size:24px;line-height:1.4;color:#cfc4b6;width:460px}
.foot{position:absolute;left:72px;bottom:56px;display:flex;gap:10px}
.chip{border:1px solid #3a3129;border-radius:999px;padding:9px 18px;font-size:18px;font-weight:500;color:#cfc4b6;background:rgba(26,22,18,.7)}
.shelf{position:absolute;right:48px;bottom:70px;width:600px;height:440px}
.b{position:absolute;bottom:0}
.b svg{width:100%;height:100%;display:block;overflow:visible}
.bottle .neck{fill:#3b332b}.bottle .rim{fill:none;stroke:rgba(255,255,255,.32);stroke-width:1.4}
.line{position:absolute;right:40px;bottom:62px;width:600px;height:1px;background:linear-gradient(90deg,transparent,#4a3f33 20%,#4a3f33 80%,transparent)}
.url{position:absolute;right:72px;top:72px;font-size:18px;color:#8f8478;letter-spacing:.02em}
</style></head><body>
<div class="copy">
  <div class="brand">duft<em>finder</em></div>
  <h1>Der richtige Duft <em>für heute.</em></h1>
  <p>Parfums nach Anlass, Jahreszeit und Noten finden. Die eigene Sammlung verwalten, mit Tagesvorschlag.</p>
</div>
<div class="foot"><span class="chip">49 Düfte</span><span class="chip">Offline-App</span><span class="chip">Open Source</span></div>
<div class="url">antony-bdc.github.io/duftfinder</div>
<div class="shelf" id="shelf"></div>
<div class="line"></div>
<script type="module">
import { bottleSVG } from "../bottle.js";
import { BY_ID } from "../perfumes.js";
const picks = [
  ["terre-dhermes", 0, 140, 182, .72],
  ["coral-fantasy-uomo", 118, 210, 273, .62],
  ["tobacco-vanille", 300, 230, 299, .78],
  ["adg-profondo", 452, 160, 208, .55],
];
const shelf = document.getElementById("shelf");
picks.forEach(([id, x, w, h, lvl], i) => {
  const d = document.createElement("div");
  d.className = "b";
  d.style.cssText = `left:${x}px;width:${w}px;height:${h}px;z-index:${i === 2 ? 3 : 2 - (i % 2)}`;
  d.innerHTML = bottleSVG(BY_ID[id], { level: lvl, animate: false, title: false });
  shelf.append(d);
});
document.fonts.ready.then(() => document.body.dataset.ready = "1");
</script>
</body></html>
