<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>duftfinder · Parfum finden und Sammlung verwalten</title>
<meta name="description" content="Finde Parfums nach Anlass, Jahreszeit und Duftnoten, vergleiche ähnliche Düfte und lass dir aus deiner eigenen Sammlung jeden Tag einen passenden vorschlagen.">
<link rel="canonical" href="https://antony-bdc.github.io/duftfinder/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="duftfinder">
<meta property="og:title" content="duftfinder · Der richtige Duft für heute">
<meta property="og:description" content="Parfums nach Anlass, Jahreszeit und Noten finden, die eigene Sammlung verwalten und jeden Tag einen passenden Vorschlag bekommen.">
<meta property="og:url" content="https://antony-bdc.github.io/duftfinder/">
<meta property="og:image" content="https://antony-bdc.github.io/duftfinder/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-tight-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Instrument Serif";src:url(fonts/instrument-serif-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Instrument Serif";src:url(fonts/instrument-serif-latin-400-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Inter Tight";src:url(fonts/inter-tight-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Inter Tight";src:url(fonts/inter-tight-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Inter Tight";src:url(fonts/inter-tight-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}

:root{
  color-scheme:only dark;
  --bg:#0e0c0a;--bg-2:#15120f;--card:#1a1612;--card-2:#211c17;--line:#2d261f;
  --fg:#f3ece2;--fg-2:#cfc4b6;--dim:#8f8478;--accent:#d6a46d;--accent-2:#f0c993;
  --serif:"Instrument Serif",Georgia,serif;--sans:"Inter Tight",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(900px 600px at 80% -10%,rgba(214,164,109,.10),transparent 60%),radial-gradient(700px 500px at -10% 30%,rgba(214,164,109,.05),transparent 60%)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* bottle art */
.bottle{width:100%;height:100%;display:block;overflow:visible}
.bottle .neck{fill:#3b332b}
.bottle .rim{fill:none;stroke:rgba(255,255,255,.32);stroke-width:1.4}
.art{position:relative;aspect-ratio:4/5;display:grid;place-items:center;padding:16% 22% 12%;
  background:radial-gradient(70% 60% at 50% 72%,color-mix(in srgb,var(--tint) 30%,transparent),transparent 70%),linear-gradient(180deg,var(--card-2),var(--card))}
.art.has-photo{padding:0;background:var(--card-2)}
.art img{width:100%;height:100%;object-fit:cover;display:block}

/* top bar */
.bar-top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line)}
.bar-inner{max-width:1240px;margin:0 auto;padding:14px 28px;padding-top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font:400 30px/1 var(--serif);letter-spacing:-.01em;text-decoration:none;color:inherit}
.brand em{color:var(--accent)}
.tabs{display:flex;gap:4px;background:var(--bg-2);border:1px solid var(--line);padding:4px;border-radius:999px}
.tab{border:0;background:none;padding:8px 18px;border-radius:999px;font-weight:500;color:var(--dim);display:flex;align-items:center;gap:8px;transition:background .25s,color .25s}
.tab[aria-current=page]{background:var(--fg);color:var(--bg)}
.tab .count{font-size:12px;color:var(--accent);font-weight:600}
.tab[aria-current=page] .count{color:#8a5a2b}
.tab .count:empty{display:none}

main{max-width:1240px;margin:0 auto;padding:44px 28px 110px}
.kicker{margin:0 0 8px;color:var(--dim);font-size:15px}
h1{margin:0;font:400 clamp(48px,7.4vw,104px)/.92 var(--serif);letter-spacing:-.025em}
h1 em{font-style:italic;color:var(--accent-2)}
.view-head{margin-bottom:34px}
.sub{font:600 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:64px 0 18px}
.house{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg-2);padding:9px 14px;border-radius:999px;font-size:15px;line-height:1.1;color:var(--fg-2);transition:border-color .2s,background .2s,color .2s,transform .15s var(--ease)}
.chip .i{width:16px;height:16px;color:var(--dim)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed=true]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip[aria-pressed=true] .i{color:#8a5a2b}
.chip .swatch,.fam-tag .swatch{width:10px;height:10px;border-radius:50%;background:var(--tint);box-shadow:0 0 12px var(--tint)}
@media (hover:hover){.chip:hover{border-color:#4a3f33;color:var(--fg)}}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:500;transition:transform .15s var(--ease),background .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
@media (hover:hover){.btn:not(.ghost):hover{background:#fff}.btn.ghost:hover{border-color:#4a3f33}}
.link{border:0;background:none;padding:6px 0;color:var(--fg-2);display:inline-flex;align-items:center;gap:6px;font-size:15px;cursor:pointer}
@media (hover:hover){.link:hover{color:var(--accent-2)}}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}

/* HEUTE stage */
.stage{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(28px,5vw,72px);align-items:center;margin-bottom:40px}
.stage-art{position:relative;border-radius:28px;overflow:hidden;border:1px solid var(--line);box-shadow:0 40px 120px -40px color-mix(in srgb,var(--tint) 45%,transparent)}
.stage-art .art{aspect-ratio:4/5;padding:14% 24% 10%}
.stage-art .art.has-photo{padding:0}
.stage-art .bottle{filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
.particles{position:absolute;inset:0;pointer-events:none}
.note{position:absolute;bottom:34%;font:italic 400 22px/1 var(--serif);color:var(--fg);white-space:nowrap;opacity:0;text-shadow:0 0 18px color-mix(in srgb,var(--tint) 70%,transparent)}
.note.n1{font-size:20px;color:var(--accent-2)}
.note.n2{font-size:18px;color:var(--fg-2)}
.today-label{margin:22px 0 10px;font:italic 400 26px/1 var(--serif);color:var(--fg-2)}
.pick-name{font:400 clamp(46px,6.6vw,92px)/.94 var(--serif);letter-spacing:-.025em;margin:10px 0 0;text-wrap:balance}
.why{color:var(--fg-2);margin:16px 0 0}
.lead{color:var(--fg-2);font-size:18px;max-width:44ch;margin:22px 0 0}
.controls{display:grid;gap:10px;padding:22px 0 0;border-top:1px solid var(--line)}

/* drydown */
.drydown{margin-top:30px;display:grid;gap:12px;max-width:560px}
.dd-scale{position:relative;height:16px;margin-left:72px;font-size:12px;color:var(--dim)}
.dd-scale span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.dd-scale span:first-child{transform:none}
.dd-scale span:last-child{transform:translateX(-100%)}
.dd-row{display:grid;grid-template-columns:60px minmax(0,1fr);column-gap:12px;align-items:center}
.dd-label{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.dd-track{height:8px;border-radius:99px;background:var(--bg-2);border:1px solid var(--line);position:relative;overflow:hidden}
.dd-bar{position:absolute;top:0;bottom:0;left:var(--from);width:calc(var(--to) - var(--from));border-radius:99px;transform-origin:left;animation:grow 1.1s var(--ease) both}
.dd-0{background:linear-gradient(90deg,#f6dbb4 70%,#f6dbb444)}
.dd-1{background:linear-gradient(90deg,var(--accent-2) 70%,#f0c99344);animation-delay:.15s}
.dd-2{background:linear-gradient(90deg,var(--accent) 75%,#d6a46d44);animation-delay:.3s}
.dd-notes{grid-column:2;font-size:14px;color:var(--fg-2);margin-top:4px}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* FINDEN */
.find{display:grid;grid-template-columns:300px minmax(0,1fr);gap:48px;align-items:start}
.find>*{min-width:0}
#find-filters{position:sticky;top:98px;display:grid;gap:22px;max-height:calc(100vh - 120px);overflow:auto;padding-right:8px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.filter h3{font:600 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 12px}
.more{display:block}
.more .filter{margin-top:22px}
.more>summary{list-style:none;cursor:pointer;display:none}
.more>summary::-webkit-details-marker{display:none}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:99px;background:var(--accent);color:var(--bg);font-size:12px;font-weight:600;padding:0 6px}
.note-field{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg-2);border-radius:14px;padding:0 12px;color:var(--dim)}
.note-field input{border:0;background:none;outline:none;padding:12px 0;width:100%;font-size:16px;color:var(--fg)}
.note-field input::placeholder{color:#6b6157}
.note-actions{display:flex;gap:16px;margin:6px 0 8px}
select{width:100%;border:1px solid var(--line);background:var(--bg-2);border-radius:14px;padding:12px;font-size:16px}
.reset{justify-self:start}
.result-head{margin:0 0 18px;color:var(--dim)}
.result-head strong{color:var(--fg);font-weight:500}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.grid.small{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .3s,transform .4s var(--ease),box-shadow .4s var(--ease)}
.card-open{all:unset;cursor:pointer;display:flex;flex-direction:column;flex:1}
.card-open:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:22px}
.card .art .bottle{transition:transform .6s var(--ease)}
.card-body{display:grid;gap:4px;padding:16px 18px 18px}
.card .name{font:400 26px/1.05 var(--serif);letter-spacing:-.01em;color:var(--fg)}
.card .meta{font-size:14px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .why{font-size:13px;color:var(--accent-2);margin:2px 0 0}
.card .match{position:absolute;left:14px;top:14px;font:600 12px/1 var(--sans);letter-spacing:.04em;color:var(--fg);background:rgba(14,12,10,.65);backdrop-filter:blur(6px);border:1px solid var(--line);padding:6px 9px;border-radius:99px}
.card .add{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(14,12,10,.65);backdrop-filter:blur(6px);display:grid;place-items:center;color:var(--fg);transition:background .2s,color .2s,border-color .2s}
.card .add.is-on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
@media (hover:hover){
  .card:hover{border-color:#4a3f33;transform:translateY(-4px);box-shadow:0 30px 60px -30px color-mix(in srgb,var(--tint) 55%,transparent)}
  .card:hover .art .bottle{transform:translateY(-6px) rotate(-2deg)}
}
.card-foot{display:flex;align-items:center;justify-content:space-between;padding:0 12px 12px 14px}
.stars{display:flex}
.stars button{border:0;background:none;padding:4px;color:#4a3f33}
.stars button.on{color:var(--accent)}
.stars button.on .i{fill:currentColor}
.card-tools{display:flex;gap:4px}
.tool{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg-2);display:grid;place-items:center;color:var(--fg-2);cursor:pointer}
@media (hover:hover){.tool:hover{color:var(--fg);border-color:#4a3f33}}

/* collection extras */
.add-own{margin-top:40px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.add-own summary{list-style:none;cursor:pointer;padding:18px 20px;display:flex;gap:8px;align-items:center;font-weight:500}
.add-own summary::-webkit-details-marker{display:none}
.own-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;padding:0 20px 20px}
.own-form label{display:grid;gap:6px;font-size:14px;color:var(--fg-2)}
.own-form input:not([type=checkbox]):not([type=range]),.own-form select{border:1px solid var(--line);background:var(--bg-2);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--fg)}
.own-form fieldset{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px 14px;grid-column:1/-1}
.own-form legend{font-size:14px;color:var(--fg-2);margin-bottom:6px;width:100%}
.own-form .check{display:flex;align-items:center;gap:6px;color:var(--fg)}
.own-form input[type=checkbox],.own-form input[type=range]{accent-color:var(--accent)}
.own-form .btn{justify-self:start;grid-column:1/-1}
.io{display:flex;gap:22px;margin-top:20px}
.empty{padding:28px 0;color:var(--fg-2);max-width:52ch}
.empty .btn{margin-top:12px}

/* detail */
dialog{border:1px solid var(--line);padding:0;background:var(--bg);color:var(--fg);border-radius:28px;width:min(940px,calc(100vw - 32px));max-height:calc(100dvh - 48px);overflow:hidden auto;overscroll-behavior:contain;box-shadow:0 40px 120px rgba(0,0,0,.6)}
dialog:focus{outline:none}
dialog::backdrop{background:rgba(5,4,3,.7);backdrop-filter:blur(6px)}
dialog[open]{animation:sheet .45s var(--ease)}
@keyframes sheet{from{opacity:0;transform:translateY(24px) scale(.98)}}
.detail-inner{padding:30px clamp(20px,4vw,44px) 40px;position:relative}
.detail-inner .close{position:absolute;right:16px;top:16px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--bg-2);display:grid;place-items:center;z-index:2}
.detail-top{display:grid;grid-template-columns:260px minmax(0,1fr);gap:34px;align-items:center}
.detail-art{border-radius:22px;overflow:hidden;border:1px solid var(--line)}
#detail-title{font:400 clamp(38px,5vw,64px)/.95 var(--serif);letter-spacing:-.02em;margin:8px 48px 14px 0}
.facts{display:flex;align-items:center;gap:14px;color:var(--fg-2);margin:0}
.fam-tag{display:inline-flex;align-items:center;gap:8px}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.tags{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0 0}
.tags dt{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.tags dd{margin:6px 0 0;color:var(--fg-2)}

#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:15px;font-weight:500;pointer-events:none;transition:opacity .2s,transform .35s var(--ease);z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0)}
footer{max-width:1240px;margin:0 auto;padding:0 28px 44px;color:var(--dim);font-size:13px}
footer a{color:var(--fg-2)}

@media (max-width:900px){
  .stage{grid-template-columns:1fr;gap:28px}
  .stage-art{max-width:420px}
  .find{grid-template-columns:1fr;gap:26px}
  #find-filters{position:static;max-height:none;overflow:visible;padding:0;gap:18px}
  .more>summary{display:flex;align-items:center;gap:8px;font-weight:500;padding:10px 0;color:var(--fg-2)}
  .filter .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -28px;padding:0 28px 4px;scrollbar-width:none}
  .filter .chips::-webkit-scrollbar{display:none}
  .chip{flex:none}
  .detail-top{grid-template-columns:1fr}
  .detail-art{max-width:260px}
}
@media (max-width:600px){
  .bar-inner{padding-left:16px;padding-right:16px;flex-wrap:wrap}
  .brand{font-size:26px}
  .tabs{width:100%;justify-content:space-between}
  .tab{flex:1;justify-content:center;padding:9px 6px}
  main{padding:26px 16px 90px}
  .stage-art{max-width:none}
  .stage-art .art{aspect-ratio:1/1;padding:8% 30% 6%}
  .controls .chips,.filter .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
  .controls .chips::-webkit-scrollbar{display:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .grid.small{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card .name{font-size:21px}
  .card-body{padding:12px 13px 14px}
  .card .meta{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .card .add{width:36px;height:36px;right:8px;top:8px}
  .card .match{left:8px;top:8px}
  .card-foot{flex-direction:column;align-items:flex-start;gap:6px;padding:0 10px 10px}
  .tags{grid-template-columns:1fr;gap:10px}
  footer{padding:0 16px 40px}
  dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:24px 24px 0 0;max-height:90dvh}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
