<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>duftfinder · Parfum finden und Sammlung verwalten</title>
<meta name="description" content="Finde Parfums nach Anlass, Jahreszeit und Duftnoten, vergleiche ähnliche Düfte und lass dir aus deiner eigenen Sammlung jeden Tag einen passenden vorschlagen.">
<meta name="theme-color" content="#f3eee6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-tight-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Instrument Serif";src:url(fonts/instrument-serif-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Instrument Serif";src:url(fonts/instrument-serif-latin-400-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Inter Tight";src:url(fonts/inter-tight-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Inter Tight";src:url(fonts/inter-tight-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Inter Tight";src:url(fonts/inter-tight-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}

:root{
  color-scheme:only light;
  --paper:#f3eee6;--paper-2:#ece5d9;--card:#faf7f2;--ink:#1c1814;--ink-2:#5f564c;--ink-3:#8b8277;
  --line:#ddd3c4;--accent:#8a4b22;--accent-2:#b4703f;--accent-soft:#ead9c6;
  --serif:"Instrument Serif",Georgia,serif;--sans:"Inter Tight",system-ui,sans-serif;
  --r:14px;--ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.bar-top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-inner{max-width:1180px;margin:0 auto;padding:14px 24px;padding-top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font:400 30px/1 var(--serif);letter-spacing:-.01em;text-decoration:none;color:inherit}
.brand em{color:var(--accent)}
.tabs{display:flex;gap:4px;background:var(--paper-2);padding:4px;border-radius:999px}
.tab{border:0;background:none;padding:8px 16px;border-radius:999px;font-weight:500;color:var(--ink-2);display:flex;align-items:center;gap:8px;transition:background .2s,color .2s}
.tab[aria-current=page]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.06)}
.tab .count{font-size:12px;color:var(--accent);font-weight:600}
.tab .count:empty{display:none}

main{max-width:1180px;margin:0 auto;padding:40px 24px 96px}
.view-head{margin-bottom:28px}
.kicker{margin:0 0 6px;color:var(--ink-2);font-size:15px}
h1{margin:0;font:400 clamp(44px,7vw,84px)/.95 var(--serif);letter-spacing:-.02em}
h2,h3{margin:0}
.sub{font:600 13px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:40px 0 12px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);padding:8px 13px;border-radius:999px;font-size:15px;line-height:1.1;transition:border-color .15s,background .15s,color .15s,transform .12s var(--ease)}
.chip .i{width:16px;height:16px;color:var(--ink-3)}
.chip:active{transform:scale(.97)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip[aria-pressed=true] .i{color:var(--accent-soft)}
@media (hover:hover){.chip:hover{border-color:var(--ink-3)}}
.controls{display:grid;gap:10px;margin-bottom:28px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;font-weight:500;transition:transform .12s var(--ease),opacity .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.link{border:0;background:none;padding:6px 0;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;font-size:15px;cursor:pointer}
@media (hover:hover){.link:hover{color:var(--accent)}.btn.ghost:hover{border-color:var(--ink-3)}}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;transition:background .15s,color .15s,border-color .15s}
.icon-btn.is-on{background:var(--accent);border-color:var(--accent);color:#fff}

/* today */
.pick{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,4vw,44px)}
.pick .house{margin:0;color:var(--accent);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.pick-name{font:400 clamp(40px,6.2vw,76px)/.98 var(--serif);letter-spacing:-.02em;margin:8px 0 12px;text-wrap:balance}
.why{color:var(--ink-2);margin:0}
.pick-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}

/* drydown */
.drydown{margin-top:28px;display:grid;gap:12px}
.dd-scale{position:relative;height:16px;margin-left:72px;font-size:12px;color:var(--ink-3)}
.dd-scale span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.dd-scale span:first-child{transform:none}
.dd-scale span:last-child{transform:translateX(-100%)}
.dd-row{display:grid;grid-template-columns:60px 1fr;column-gap:12px;align-items:center}
.dd-label{font-size:14px;font-weight:600;color:var(--ink-2)}
.dd-track{height:10px;min-width:0;border-radius:99px;background:var(--paper-2);position:relative;overflow:hidden}
.dd-bar{position:absolute;top:0;bottom:0;left:var(--from);width:calc(var(--to) - var(--from));border-radius:99px;transform-origin:left;animation:grow .9s var(--ease) both}
.dd-0{background:linear-gradient(90deg,#d9a273 70%,#d9a27355)}
.dd-1{background:linear-gradient(90deg,#bf7a45 70%,#bf7a4555);animation-delay:.12s}
.dd-2{background:linear-gradient(90deg,var(--accent) 75%,#8a4b2255);animation-delay:.24s}
.dd-notes{grid-column:2;font-size:14px;color:var(--ink-2);margin-top:4px}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* find */
.find{display:grid;grid-template-columns:330px minmax(0,1fr);gap:48px;align-items:start}
.find>*{min-width:0}
.more{display:block}
.more .filter{margin-top:22px}
.more>summary{list-style:none;cursor:pointer;display:none}
.more>summary::-webkit-details-marker{display:none}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:99px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;padding:0 6px}
#find-filters{position:sticky;top:96px;display:grid;gap:22px;max-height:calc(100vh - 120px);overflow:auto;padding-right:6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.filter h3{font:600 13px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.note-field{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 12px;color:var(--ink-3)}
.note-field input{border:0;background:none;outline:none;padding:11px 0;width:100%;font-size:16px;color:var(--ink)}
.note-actions{display:flex;gap:16px;margin:6px 0 8px}
select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font-size:16px}
.reset{justify-self:start}
.result-head{margin:0 0 14px;color:var(--ink-2)}

/* rows */
.list{display:grid;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding:16px 0}
.row-main{all:unset;cursor:pointer;flex:1;min-width:0;display:grid;gap:2px}
.row-main:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.house{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.name{font:400 27px/1.1 var(--serif);letter-spacing:-.01em}
.meta{font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .why{font-size:14px;color:var(--accent)}
.row-side{display:flex;align-items:center;gap:14px}
.match{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:96px;justify-content:flex-end}
.match .bar{width:52px;height:4px;border-radius:9px;background:var(--paper-2);overflow:hidden}
.match .bar i{display:block;height:100%;background:var(--accent)}
@media (hover:hover){.row-main:hover .name{color:var(--accent)}}

/* collection */
.stars{display:flex}
.stars button{border:0;background:none;padding:4px;color:var(--line)}
.stars button.on{color:var(--accent)}
.stars button.on .i{fill:currentColor}
.add-own{margin-top:36px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.add-own summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;gap:8px;align-items:center;font-weight:500}
.add-own summary::-webkit-details-marker{display:none}
.own-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;padding:0 18px 18px}
.own-form label{display:grid;gap:6px;font-size:14px;color:var(--ink-2)}
.own-form input:not([type=checkbox]):not([type=range]),.own-form select{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink)}
.own-form fieldset{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px 14px;grid-column:1/-1}
.own-form legend{font-size:14px;color:var(--ink-2);margin-bottom:6px;width:100%}
.own-form .check{display:flex;align-items:center;gap:6px;color:var(--ink)}
.own-form input[type=range]{accent-color:var(--accent)}
.own-form .btn{justify-self:start;grid-column:1/-1}
.io{display:flex;gap:22px;margin-top:20px}

.empty{padding:36px 0;color:var(--ink-2);max-width:52ch}
.empty .btn{margin-top:12px}

/* detail */
dialog{border:0;padding:0;overflow:hidden auto;overscroll-behavior:contain;background:var(--card);color:var(--ink);border-radius:24px;width:min(720px,calc(100vw - 32px));max-height:calc(100dvh - 48px);box-shadow:0 30px 80px rgb(28 24 20/.25)}
dialog:focus{outline:none}
dialog::backdrop{background:rgb(28 24 20/.35);backdrop-filter:blur(2px)}
dialog[open]{animation:sheet .32s var(--ease)}
@keyframes sheet{from{opacity:0;transform:translateY(16px)}}
.detail-inner{padding:30px clamp(20px,4vw,40px) 34px;position:relative}
.detail-inner .close{position:absolute;right:16px;top:16px}
#detail-title{font:400 clamp(36px,5vw,56px)/1 var(--serif);letter-spacing:-.02em;margin:6px 48px 10px 0}
.facts{display:flex;align-items:center;gap:10px;color:var(--ink-2);margin:0}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.tags{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0 0}
.tags dt{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.tags dd{margin:4px 0 0}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;font-size:15px;pointer-events:none;transition:opacity .2s,transform .3s var(--ease);z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0)}
footer{max-width:1180px;margin:0 auto;padding:0 24px 40px;color:var(--ink-3);font-size:13px}
footer a{color:inherit}

@media (max-width:860px){
  .find{grid-template-columns:1fr;gap:28px}
  #find-filters{position:static;max-height:none;overflow:visible;padding:0;gap:18px}
  .more>summary{display:flex;align-items:center;gap:8px;font-weight:500;padding:10px 0;color:var(--ink-2)}
  .more[open]>summary{margin-bottom:4px}
  .filter .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -24px;padding:0 24px 4px;scrollbar-width:none}
  .filter .chips::-webkit-scrollbar{display:none}
  .chip{flex:none}
}
@media (max-width:600px){
  .bar-inner{padding-left:16px;padding-right:16px;flex-wrap:wrap}
  .brand{font-size:26px}
  .tabs{width:100%;justify-content:space-between}
  .tab{flex:1;justify-content:center;padding:9px 6px}
  main{padding:28px 16px 80px}
  .controls .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
  .filter .chips{margin:0 -16px;padding:0 16px 4px}
  .chip{flex:none}
  .name{font-size:23px}
  .match{min-width:0}.match .bar{display:none}
  .row{align-items:flex-start}
  .tags{grid-template-columns:1fr;gap:10px}
  .dd-scale{margin-left:72px}
  dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:22px 22px 0 0;max-height:88dvh}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

 x2="12" y1="3" y2="15" /></symbol><symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22" /> <path d="m18 2 4 4-4 4" /> <path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2" /> <path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8" /> <path d="m18 14 4 4-4 4" /></symbol><symbol id="i-wind" viewBox="0 0 24 24"><path d="M12.8 19.6A2 2 0 1 0 14 16H2" /> <path d="M17.5 8a2.5 2.5 0 1 1 2 4H2" /> <path d="M9.8 4.4A2 2 0 1 1 11 8H2" /></symbol><symbol id="i-compass" viewBox="0 0 24 24"><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z" /> <circle cx="12" cy="12" r="10" /></symbol></svg>

  <div class="bar-inner">
    <a class="brand" href="#heute" aria-label="duftfinder Startseite">duft<em>finder</em></a>
    <nav class="tabs" aria-label="Bereiche">
      <button type="button" class="tab" data-view="heute">Heute</button>
      <button type="button" class="tab" data-view="finden">Finden</button>
      <button type="button" class="tab" data-view="sammlung">Sammlung <span class="count" id="count-sammlung"></span></button>
